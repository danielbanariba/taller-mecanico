services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taller
      POSTGRES_PASSWORD: taller
      POSTGRES_DB: taller
    ports:
      - "5440:5432"
    volumes:
      - taller_db_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taller -d taller"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taller_db_data:
